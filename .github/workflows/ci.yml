name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo test -p mapgen-data --no-default-features

  # Rebuilds docs/examples from pinned real data on every OS and requires the
  # output to be byte-identical to the committed gallery.
  gallery:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: data
          key: data-${{ runner.os }}-${{ hashFiles('scripts/fetch-data.sh') }}
      - name: Fetch pinned datasets
        run: |
          scripts/fetch-data.sh ne-geojson
          scripts/fetch-data.sh geoboundaries FRA ADM1
          scripts/fetch-data.sh geoboundaries USA ADM2
          scripts/fetch-data.sh us-counties-fips
          scripts/fetch-data.sh ne-worldview IND
          scripts/fetch-data.sh ne-worldview PAK
      - run: scripts/build-examples.sh
      - name: Gallery is byte-identical
        run: git diff --exit-code --stat docs/examples

  # Renders gallery maps with librsvg (Wikimedia Commons' renderer) in Debian
  # trixie and compares them with tests/rsvg/ references.
  rsvg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/rsvg-check.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rsvg-check
          path: target/rsvg-check

  # EPSG projections through PROJ (built from source: `bundled-proj`).
  proj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake sqlite3 libsqlite3-dev
      - run: cargo clippy -p mapgen-core -p mapgen-cli --features mapgen-cli/bundled-proj --all-targets
      - run: cargo test -p mapgen-core --features bundled-proj
      - name: End-to-end EPSG render
        run: |
          cargo run --release -p mapgen-cli --features bundled-proj -- render \
            -i crates/mapgen-data/tests/fixtures/twin-regions.geojson --projection epsg:3035 \
            -o "$RUNNER_TEMP/epsg.svg"
          grep -q 'class="mg-land' "$RUNNER_TEMP/epsg.svg"

  wasm:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/mapgen-wasm/package-lock.json
      - uses: actions/cache@v4
        with:
          path: data
          key: data-${{ runner.os }}-${{ hashFiles('scripts/fetch-data.sh') }}
      - name: Fetch pinned datasets (for WASM/native parity tests)
        run: |
          scripts/fetch-data.sh ne-geojson
          scripts/fetch-data.sh geoboundaries FRA ADM1
          scripts/fetch-data.sh ne-worldview IND
      - run: cargo clippy -p mapgen-wasm --target wasm32-unknown-unknown --all-targets
      - name: wasm-bindgen tests (Node)
        working-directory: crates/mapgen-wasm
        run: |
          set -o pipefail
          wasm-pack test --node 2>&1 | tee "$RUNNER_TEMP/node.log"
          grep -Eq "test result: ok\. [1-9][0-9]* passed" "$RUNNER_TEMP/node.log" || { echo "no wasm tests ran"; exit 1; }
      - name: wasm-bindgen tests (headless Chrome)
        working-directory: crates/mapgen-wasm
        env:
          WASM_BINDGEN_USE_BROWSER: "1"
        run: |
          set -o pipefail
          wasm-pack test --headless --chrome --chromedriver "$CHROMEWEBDRIVER/chromedriver" 2>&1 | tee "$RUNNER_TEMP/chrome.log"
          grep -Eq "test result: ok\. [1-9][0-9]* passed" "$RUNNER_TEMP/chrome.log" || { echo "no wasm tests ran in the browser"; exit 1; }
      - name: npm package, types, and parity tests
        working-directory: crates/mapgen-wasm
        env:
          MAPGEN_REQUIRE_DATA: "1"
        run: |
          npm ci
          npm run build:node
          npm run typecheck
          npm test
          npm run build:web
