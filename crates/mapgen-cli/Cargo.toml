[package]
name = "mapgen-cli"
description = "Command-line interface for map-generator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "mapgen"
path = "src/main.rs"

[dependencies]
mapgen-core.workspace = true
mapgen-data = { workspace = true, features = ["gpkg"] }
anyhow.workspace = true
geo.workspace = true
geo-types.workspace = true
rayon.workspace = true
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true

[features]
# EPSG projections through PROJ (`--projection epsg:5070`); needs libproj.
proj = ["mapgen-core/proj"]
# ...or build PROJ from source.
bundled-proj = ["mapgen-core/bundled-proj"]
