<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>map-generator playground</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%223%22 fill=%22%23c6ecff%22/%3E%3Cpath d=%22M3 11 6 4l3 5 2-2 2 4z%22 fill=%22%23fefee9%22 stroke=%22%23646464%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside>
  <header>
    <h1>map-generator</h1>
    <p class="muted">Deterministic SVG maps, rendered in your browser with WebAssembly. <span id="version"></span></p>
  </header>

  <fieldset>
    <legend>Data</legend>
    <label>Sample
      <select id="sample">
        <option value="ne-admin1">Natural Earth: states &amp; provinces</option>
        <option value="ne-admin0">Natural Earth: countries</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="with-context" checked> Neighbours &amp; lakes</label>
    <button id="load-sample" class="primary">Load sample</button>
    <details>
      <summary>…or your own GeoJSON</summary>
      <label>File <input type="file" id="file" accept=".geojson,.json,application/geo+json"></label>
      <label>Layout
        <select id="file-dataset">
          <option value="custom">custom (id, name)</option>
          <option value="geoboundaries">geoBoundaries</option>
          <option value="ne-admin1">Natural Earth Admin-1</option>
          <option value="ne-admin0">Natural Earth Admin-0</option>
        </select>
      </label>
      <label>Credit <input type="text" id="file-credit" placeholder="Source (licence)"></label>
    </details>
    <p id="data-status" class="muted" role="status"></p>
  </fieldset>

  <fieldset id="map-options" disabled>
    <legend>Map</legend>
    <label>Region <select id="region"></select></label>
    <label>Frame
      <select id="frame">
        <option value="auto">auto (main landmass)</option>
        <option value="all">all features</option>
        <option value="world">world</option>
      </select>
    </label>
    <label>Frame preset <select id="bbox"><option value="">none</option></select></label>
    <label>Width <input type="number" id="width" value="900" min="100" max="4000" step="50"></label>
    <label>Simplify <input type="range" id="simplify" min="0" max="3" step="0.25" value="0.5"> <output id="simplify-out">0.5 px</output></label>
    <label class="check"><input type="checkbox" id="labels" checked> Labels</label>
    <label class="check"><input type="checkbox" id="credit"> Data credit on map</label>
  </fieldset>

  <fieldset id="style-options" disabled>
    <legend>Colours</legend>
    <label>Theme <select id="theme"></select></label>
    <div id="colors"></div>
  </fieldset>
</aside>

<main>
  <div class="toolbar">
    <p id="info" class="muted" aria-live="polite">Load a sample to start.</p>
    <span id="hover" class="muted"></span>
    <button id="download" disabled>Download SVG</button>
  </div>
  <div id="map" aria-label="Rendered map"></div>
  <p id="error" role="alert"></p>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
