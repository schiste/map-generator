[package]
name = "mapgen-data"
description = "Data source adapters (GeoPackage, GeoJSON) for map-generator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
mapgen-core.workspace = true
geo.workspace = true
geo-types.workspace = true
rstar = "0.12"
thiserror.workspace = true
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
geozero = { version = "0.14", default-features = false, features = ["with-wkb", "with-geo"], optional = true }
geojson = { version = "0.24", features = ["geo-types"] }
serde_json.workspace = true

[features]
default = ["gpkg"]
# GeoPackage support (bundles SQLite; not available on wasm32).
gpkg = ["dep:rusqlite", "dep:geozero"]

[dev-dependencies]
roxmltree = "0.20"
rusqlite = { version = "0.37", features = ["bundled"] }
