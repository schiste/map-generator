[workspace]
resolver = "2"
members = [
    "crates/mapgen-core",
    "crates/mapgen-data",
    "crates/mapgen-spec",
    "crates/mapgen-cli",
    "crates/mapgen-wasm",
    "crates/mapgen-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/schiste/map-generator"
authors = ["Christophe Henner"]

[workspace.dependencies]
mapgen-core = { path = "crates/mapgen-core" }
mapgen-data = { path = "crates/mapgen-data", default-features = false }
mapgen-spec = { path = "crates/mapgen-spec" }
geo = { version = "0.33", default-features = false }
geo-types = "0.7"
thiserror = "2"
anyhow = "1"
rayon = "1"
libm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
